ModulePath /usr/lib/proftpd
<IfModule !mod_tls.c>
  LoadModule mod_tls.c
</IfModule>

ServerName "ProFTPD test"
ServerType standalone
DefaultServer on
Port 21
UseIPv6 off
UseReverseDNS off
User nobody
Group nogroup
MaxInstances 30
WtmpLog off
ScoreboardFile /run/proftpd.scoreboard
PidFile /run/proftpd.pid

<Global>
  DefaultRoot ~
  RequireValidShell off
  AllowOverwrite on
  Umask 022
  PassivePorts 30020 30029
  TLSEngine on
  TLSRequired off
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /certs/server.crt
  TLSRSACertificateKeyFile /certs/server.key
  TLSVerifyClient off
  TLSLog /dev/stderr
</Global>

# Implicit TLS
<VirtualHost 0.0.0.0>
  ServerName "ProFTPD implicit TLS"
  Port 990
  TLSOptions UseImplicitSSL
</VirtualHost>

# MLSD not advertised in FEAT, to force the LIST fallback
<VirtualHost 0.0.0.0>
  ServerName "ProFTPD without MLSD"
  Port 2124
  FactsAdvertise off
</VirtualHost>
